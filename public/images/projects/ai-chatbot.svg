<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" rx="16" fill="#090D16"/>
  <rect x="1" y="1" width="798" height="478" rx="15" stroke="#1B2438" stroke-width="2"/>
  
  <!-- Glows -->
  <circle cx="220" cy="120" r="140" fill="#38BDF8" fill-opacity="0.08"/>
  <circle cx="650" cy="360" r="160" fill="#818CF8" fill-opacity="0.08"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="760" height="44" rx="8" fill="#101726"/>
  <circle cx="44" cy="42" r="6" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="64" cy="42" r="6" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="84" cy="42" r="6" fill="#10B981" fill-opacity="0.8"/>
  <rect x="110" y="32" width="230" height="20" rx="6" fill="#1B253D"/>
  <text x="125" y="46" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">ai-chatbot-m9sm.onrender.com/portal</text>
  <rect x="670" y="30" width="95" height="24" rx="6" fill="#10B981" fill-opacity="0.2"/>
  <text x="682" y="46" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">● Streaming API</text>

  <!-- Left Sidebar: Conversations & Prompts -->
  <rect x="20" y="80" width="180" height="380" rx="10" fill="#0E1524" stroke="#1B2438"/>
  <text x="36" y="110" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Prompt Library</text>

  <rect x="30" y="126" width="160" height="34" rx="6" fill="#38BDF8" fill-opacity="0.15"/>
  <text x="42" y="147" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⚡ Code Architecture</text>

  <rect x="30" y="170" width="160" height="34" rx="6" fill="#162035"/>
  <text x="42" y="191" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">📝 Copywriting Assistant</text>

  <rect x="30" y="214" width="160" height="34" rx="6" fill="#162035"/>
  <text x="42" y="235" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">🐛 Bug Diagnostics</text>

  <rect x="30" y="258" width="160" height="34" rx="6" fill="#162035"/>
  <text x="42" y="279" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">📊 SQL Query Optimizer</text>

  <!-- Token Telemetry Box -->
  <rect x="30" y="340" width="160" height="104" rx="8" fill="#131B2D" stroke="#1E2A45"/>
  <text x="42" y="362" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SESSION TELEMETRY</text>
  <text x="42" y="386" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">1,248 Tokens</text>
  <text x="42" y="408" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">Streaming Latency: 42ms</text>
  <text x="42" y="424" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Model: GPT-4o-mini</text>

  <!-- Main Chat Conversation Window -->
  <rect x="216" y="80" width="564" height="380" rx="10" fill="#101726" stroke="#1B2438"/>
  
  <!-- User prompt bubble -->
  <rect x="420" y="104" width="340" height="56" rx="12" fill="#1E2D4A"/>
  <text x="436" y="126" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="500">"Optimize this Express middleware for token</text>
  <text x="436" y="144" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="500">rate-limiting and stream handling."</text>

  <!-- Assistant response bubble with code block -->
  <rect x="236" y="174" width="480" height="196" rx="12" fill="#141E33" stroke="#233252"/>
  <text x="254" y="200" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AI Assistant (Streaming Response)</text>
  <text x="254" y="222" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">Here is a production-ready streaming Express route using SSE:</text>

  <!-- Code snippet container -->
  <rect x="254" y="236" width="444" height="88" rx="6" fill="#0A0E17"/>
  <text x="268" y="258" fill="#F43F5E" font-family="monospace" font-size="10">res.setHeader('Content-Type', 'text/event-stream');</text>
  <text x="268" y="276" fill="#38BDF8" font-family="monospace" font-size="10">res.setHeader('Cache-Control', 'no-cache');</text>
  <text x="268" y="294" fill="#10B981" font-family="monospace" font-size="10">for await (const chunk of stream) res.write(chunk);</text>

  <rect x="254" y="334" width="85" height="24" rx="4" fill="#1E2B45"/>
  <text x="264" y="350" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Copy Code</text>

  <!-- Input Prompt Bar -->
  <rect x="236" y="388" width="460" height="48" rx="8" fill="#162035" stroke="#253556"/>
  <text x="252" y="418" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Type an instruction or choose a prompt preset...</text>
  <rect x="706" y="388" width="54" height="48" rx="8" fill="#38BDF8"/>
  <path d="M 726 412 L 738 412 M 734 406 L 740 412 L 734 418" stroke="#090D16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
