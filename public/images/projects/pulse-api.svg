<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" rx="16" fill="#0A0C12"/>
  <rect x="1" y="1" width="798" height="478" rx="15" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Topology Grid lines -->
  <line x1="200" y1="120" x2="400" y2="240" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="200" y1="360" x2="400" y2="240" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="400" y1="240" x2="600" y2="160" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="400" y1="240" x2="600" y2="320" stroke="#10B981" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Left source nodes -->
  <rect x="100" y="90" width="140" height="60" rx="10" fill="#131724" stroke="#38BDF8"/>
  <text x="120" y="126" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Stripe Webhooks</text>

  <rect x="100" y="330" width="140" height="60" rx="10" fill="#131724" stroke="#8B5CF6"/>
  <text x="120" y="366" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Shopify Events</text>

  <!-- Central Queue / Hub -->
  <circle cx="400" cy="240" r="70" fill="#161B28" stroke="#38BDF8" stroke-width="3"/>
  <text x="358" y="235" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">PULSE HUB</text>
  <text x="366" y="255" fill="#94A3B8" font-family="monospace" font-size="11">14ms latency</text>

  <!-- Right destination nodes -->
  <rect x="560" y="130" width="160" height="60" rx="10" fill="#131724" stroke="#38BDF8"/>
  <text x="580" y="166" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PostgreSQL DB</text>

  <rect x="560" y="290" width="160" height="60" rx="10" fill="#131724" stroke="#10B981"/>
  <text x="580" y="326" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Slack &amp; Alerts</text>
</svg>
